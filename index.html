<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informe Laboral - PSS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="report-page">
    <header class="report-header">
      <div class="logo-slot" aria-label="Logotipo PSS">
        <!-- Coloque aquí el PNG del logotipo, por ejemplo: logo.png -->
        <img src="PSS_1920x1080_transparente.png" alt="PSS" />
      </div>
      <div class="heading">
        <h1>INFORME LABORAL</h1>
        <h2>EMPRESA DE SEGURIDAD PRIVADA AUTORIZADA</h2>
        <p>DSSP Resolución 9310-RAS-2024</p>
      </div>
      <div class="document-date field">
        <label for="documentDate">Fecha documento</label>
        <input id="documentDate" type="date" />
        <button class="print-button print-top" type="button" data-print>🖨 Imprimir / PDF</button>
      </div>
    </header>

    <form id="reportForm">
      <section class="incident-meta">
        <div class="inline-field">
          <label for="eventDate">Fecha incidente</label>
          <input id="eventDate" type="date" />
        </div>
        <div class="inline-field">
          <label for="eventTime">Hora incidente</label>
          <input id="eventTime" type="time" />
        </div>
      </section>

      <section class="form-section" id="workplaceSection">
        <label for="workplace">Lugar de Trabajo</label>
        <select id="workplace">
          <option value="">Seleccione una opción</option>
          <option>Central</option>
        <option>Condominio Condal</option>
        <option>Casa Yiya</option>
        <option>Casa San Pedro</option>
        <option>Casa Tirol</option>
        <option>Casa Castillo</option>
        <option>Casa Puntarenas</option>
        <option>Villas del Rio</option>
        <option>Barrio Tena</option>
        <option>Bodegas Condal Rohrmoser TLA</option>
        <option>Parque Condal Tibas</option>
        <option>Oficentro Condal Escazu</option>
        <option>Oficentro Condal San Pedro</option>
        <option>Bodegas Barrio Mexico</option>
        <option>Parque Industrial Condal Orotina</option>
        <option>Parque Industrial Condal Ciruelas</option>
        <option>Forum 2 Edificios JKL</option>
        <option>Recidencia Casa Tena</option>
        <option>Edificio Anexo Galerias</option>
        <option>Condominio Mallorca</option>
        <option>Parque Condal Colima</option>
        <option>Oficentro Rohrmoser</option>
        <option>Espacio Quattro</option>
        <option>Bodegas Pavas Centro</option>
        <option>Oficentro Sabana</option>

        <option value="Otro">Otro</option>
        </select>
      </section>

      <section class="form-section" id="otherWorkplaceBox" hidden>
        <label for="otherWorkplace">Especifique el lugar de trabajo</label>
        <input id="otherWorkplace" type="text" placeholder="Especifique el lugar de trabajo" />
      </section>

      <section class="form-section" id="faultTypeSection">
        <label for="faultType">Tipo de Falta</label>
        <select id="faultType">
          <option value="">Seleccione una opción</option><option>Llegada tardía</option><option>Ausencia</option>
          <option>Higiene personal inadecuada</option><option>Uso incorrecto del equipo de trabajo</option>
          <option>No comunicó novedades</option><option>Daño al equipo asignado</option>
          <option>Uso de celular en horario laboral</option><option value="Otro">Otro</option>
        </select>
      </section>

      <section class="form-section" id="otherFaultBox" hidden>
        <label for="otherFault">Especifique el tipo de falta</label>
        <textarea id="otherFault" rows="1" placeholder="Especifique el tipo de falta"></textarea>
      </section>

      <section class="form-section detail-section">
        <label for="description">Descripción del Incidente / Detalle de la falta</label>
        <textarea id="description" rows="1" placeholder="Detalle lo ocurrido..."></textarea>
      </section>

      <section class="employee-section">
        <label class="check-label"><input type="checkbox" id="includeEmployeeInfo" checked /> Incluir información que el empleado quiera aportar</label>
        <div id="employeeInfoBox">
          <label for="employeeInfo">Información que el empleado quiera aportar</label>
          <textarea id="employeeInfo" rows="4"></textarea>
        </div>
      </section>

      <section class="form-section evidence-section">
        <label>Evidencias</label>
        <div class="upload-row">
          <input type="file" id="photos" accept="image/*" multiple />
          <button class="camera-button" type="button" id="cameraButton">Tomar fotografía</button>
        </div>
        <div id="evidencePreview" class="evidence-preview" aria-live="polite"></div>
      </section>

      <section class="signatures-section">
        <h2>Firmas</h2>
        <label class="check-label"><input type="checkbox" id="showSupervisor" checked /> Incluir firma de Encargado / Supervisor</label>
        <label class="check-label"><input type="checkbox" id="showManagement" checked /> Incluir firma de Gerencia / RRHH</label>
        <label class="check-label"><input type="checkbox" id="showEmployee" checked /> Incluir firma de Empleado</label>
        <div class="signature-grid">
          <article class="signature-card" id="supervisorSignature">
            <h3>Encargado / Supervisor</h3>
            <div class="signature-fields"><label>Nombre y apellidos<input type="text" /></label><label>Cédula<input type="text" /></label></div>
            <label class="check-label signature-permission"><input type="checkbox" id="allowSupervisorSignature" checked /> Permitir firma táctil o digital</label>
            <div class="digital-signature-controls">
              <canvas class="signature-canvas" data-signature="supervisor"></canvas>
              <label>Subir firma JPG o PNG<input type="file" accept="image/png,image/jpeg" class="signature-upload" data-canvas="supervisor" /></label>
              <button type="button" class="clear-signature" data-clear="supervisor">Limpiar firma</button>
            </div>
            <div class="physical-signature-line" hidden aria-label="Línea para firma física"></div>
          </article>
          <article class="signature-card" id="managementSignature">
            <h3>Gerencia / RRHH</h3>
            <div class="signature-fields"><label>Nombre y apellidos<input type="text" /></label><label>Cédula<input type="text" /></label></div>
            <label class="check-label signature-permission"><input type="checkbox" id="allowManagementSignature" checked /> Permitir firma táctil o digital</label>
            <div class="digital-signature-controls">
              <canvas class="signature-canvas" data-signature="management"></canvas>
              <label>Subir firma JPG o PNG<input type="file" accept="image/png,image/jpeg" class="signature-upload" data-canvas="management" /></label>
              <button type="button" class="clear-signature" data-clear="management">Limpiar firma</button>
            </div>
            <div class="physical-signature-line" hidden aria-label="Línea para firma física"></div>
          </article>
          <article class="signature-card" id="employeeSignature">
            <h3>Empleado</h3>
            <div class="signature-fields"><label>Nombre y apellidos<input type="text" /></label><label>Cédula<input type="text" /></label></div>
            <label class="check-label signature-permission"><input type="checkbox" id="allowEmployeeSignature" checked /> Permitir firma táctil o digital</label>
            <div class="digital-signature-controls">
              <canvas class="signature-canvas" data-signature="employee"></canvas>
              <label>Subir firma JPG o PNG<input type="file" accept="image/png,image/jpeg" class="signature-upload" data-canvas="employee" /></label>
              <button type="button" class="clear-signature" data-clear="employee">Limpiar firma</button>
            </div>
            <div class="physical-signature-line" hidden aria-label="Línea para firma física"></div>
          </article>
        </div>
      </section>

      <div class="bottom-action">
        <button class="print-button" type="button" data-print>🖨 Imprimir / PDF</button>
      </div>
    </form>

    <footer>
      <div class="footer-logo logo-slot">
        <!-- Coloque aquí el PNG del logotipo, por ejemplo: logo.png -->
        <img src="PSS_1920x1080_transparente.png" alt="PSS" />
      </div>
      <div><strong>Professional Security Services (PSS)</strong><br />Cédula Jurídica 3-101-559345<br />Empresa Autorizada por la DSSP según Resolución 9310 RAS-2024</div>
      <div class="footer-logo logo-slot right">
        <!-- Coloque aquí el PNG del logotipo, por ejemplo: logo.png -->
        <img src="PSS_1920x1080_transparente.png" alt="PSS" />
      </div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
